<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>歡迎來到工地貓的地盤</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 頂部：切換按鈕區 -->
    <header>
        <h1>認識這裡的貓貓</h1>
        <div class="toggle-buttons">
            <button id="btn-cat1" class="active">胖丁</button>
            <button id="btn-cat2">夢幻</button>
        </div>
    </header>

    <!-- 中段上：動態名片區 -->
    <section class="profile-section">
        <div id="card-cat1" class="profile-card active-card">
            <img src="media/cat1-avatar.jpeg" alt="胖丁" class="avatar">
            <h2>工頭 胖丁</h2>
        </div>
        <div id="card-cat2" class="profile-card hidden-card">
            <img src="media/cat2-avatar.jpeg" alt="夢幻" class="avatar">
            <h2>保全 夢幻</h2>
        </div>
    </section>

    <!-- 中段：生活寫真牆 -->
    <section class="gallery-section">
        <h3>工地巡視紀錄</h3>
        
        <!-- 新增：左右滑動的分類按鈕區 -->
        <div class="filter-bar">
            <button class="filter-btn active" data-filter="all">全部</button>
            <button class="filter-btn" data-filter="cat1">胖丁</button>
            <button class="filter-btn" data-filter="cat2">夢幻</button>
            <button class="filter-btn" data-filter="work">上班中</button>
            <button class="filter-btn" data-filter="slack">充電中</button>
        </div>

        <!-- 智慧型照片牆：加上隱藏的 data-category 標籤供 JS 篩選 -->
        <div class="gallery-grid" id="gallery-grid">
            <img src="media/photo-1-1.jpeg" alt="巡視照 1-1" class="gallery-item" data-category="cat1">
            <img src="media/photo-1-2.jpeg" alt="巡視照 1-2" class="gallery-item" data-category="cat1">
            <img src="media/photo-1-3.jpeg" alt="巡視照 1-3" class="gallery-item" data-category="cat1">
            <img src="media/photo-1-4.jpeg" alt="巡視照 1-4" class="gallery-item" data-category="cat1">
            <img src="media/photo-1-5.jpeg" alt="巡視照 1-5" class="gallery-item" data-category="cat1">
            <img src="media/photo-1-6.jpeg" alt="巡視照 1-6" class="gallery-item" data-category="cat1">
            <img src="media/photo-1-7.jpeg" alt="巡視照 1-7" class="gallery-item" data-category="cat1">
            <img src="media/photo-1-8.jpeg" alt="巡視照 1-8" class="gallery-item" data-category="cat1">
            <img src="media/photo-1-9.jpeg" alt="巡視照 1-9" class="gallery-item" data-category="cat1">
            <img src="media/photo-1-10.jpeg" alt="巡視照 1-10" class="gallery-item" data-category="cat1">
            <img src="media/photo-2-1.jpeg" alt="巡視照 2-1" class="gallery-item" data-category="cat2 ">
            <img src="media/photo-2-2.jpeg" alt="巡視照 2-2" class="gallery-item" data-category="cat2 ">
            <img src="media/photo-2-3.jpeg" alt="巡視照 2-3" class="gallery-item" data-category="cat2 ">
            <img src="media/photo-2-4.jpeg" alt="巡視照 2-4" class="gallery-item" data-category="cat2 ">
            <img src="media/photo-2-5.jpeg" alt="巡視照 2-5" class="gallery-item" data-category="cat2 ">
            <img src="media/photo-2-6.jpeg" alt="巡視照 2-6" class="gallery-item" data-category="cat2 ">
            <img src="media/photo-2-7.jpeg" alt="巡視照 2-7" class="gallery-item" data-category="cat2 ">
            <img src="media/photo-2-8.jpeg" alt="巡視照 2-8" class="gallery-item" data-category="cat2 ">
            <img src="media/photo-2-9.jpeg" alt="巡視照 2-9" class="gallery-item" data-category="cat2 ">
            <img src="media/photo-2-10.jpeg" alt="巡視照 2-10" class="gallery-item" data-category="cat2 ">
            <img src="media/photo-3-1.jpeg" alt="巡視照 3-1" class="gallery-item" data-category="work">
            <img src="media/photo-3-2.jpeg" alt="巡視照 3-2" class="gallery-item" data-category="work">
            <img src="media/photo-3-3.jpeg" alt="巡視照 3-3" class="gallery-item" data-category="work">
            <img src="media/photo-3-4.jpeg" alt="巡視照 3-4" class="gallery-item" data-category="work">
            <img src="media/photo-3-5.jpeg" alt="巡視照 3-5" class="gallery-item" data-category="work">
            <img src="media/photo-3-6.jpeg" alt="巡視照 3-6" class="gallery-item" data-category="work">  
            <img src="media/photo-4-1.jpeg" alt="巡視照 4-1" class="gallery-item" data-category="slack">
            <img src="media/photo-4-2.jpeg" alt="巡視照 4-2" class="gallery-item" data-category="slack">
            <img src="media/photo-4-3.jpeg" alt="巡視照 4-3" class="gallery-item" data-category="slack">
        </div>

        <!-- 新增：載入更多按鈕 -->
        <button id="load-more-btn" class="load-more-btn">載入更多照片</button>
    </section>

    <!-- 中段下：動態影音區 -->
    <section class="video-section">
        <h3>打混摸魚實況</h3>
        <video src="media/cat-video.mov" muted autoplay loop playsinline></video>
    </section>

    <!-- 底部：社群入口 -->
    <footer>
        <a href="https://line.me/S/sticker/33531700/?lang=zh-Hant&utm_source=gnsh_stickerDetail" target="_blank" class="social-btn">查看工地貓的LINE貼圖</a>
    </footer>

    <!-- 新增：放大燈箱區塊 (預設隱藏，位於網頁最上層) -->
    <div id="lightbox" class="lightbox">
        <span id="lightbox-close" class="lightbox-close">&times;</span>
        <img id="lightbox-img" class="lightbox-content" src="">
    </div>

    <script src="script.js"></script>
</body>
</html>
