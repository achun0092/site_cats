<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>歡迎來到工地貓的地盤</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 頂部：切換按鈕區 -->
    <header>
        <h1>認識這裡的工地貓</h1>
        <div class="toggle-buttons">
            <button id="btn-cat1" class="active">胖丁</button>
            <button id="btn-cat2">夢幻</button>
        </div>
    </header>

    <!-- 中段上：動態名片區 -->
    <section class="profile-section">
        <!-- 第一隻貓咪的名片 -->
        <div id="card-cat1" class="profile-card active-card">
            <!-- 檔案名稱維持你設定的底線不變 -->
            <img src="media/cat1-avatar.jpeg" alt="胖丁" class="avatar">
            <h2>胖丁</h2>
        </div>

        <!-- 第二隻貓咪的名片 -->
        <div id="card-cat2" class="profile-card hidden-card">
            <img src="media/cat2-avatar.jpeg" alt="夢幻" class="avatar">
            <h2>夢幻</h2>
        </div>
    </section>

    <!-- 中段：生活寫真牆 -->
    <section class="gallery-section">
        <h3>工地巡視紀錄</h3>
        <div class="gallery-grid">
            <img src="media/photo-1.jpeg" alt="巡視照 1">
            <img src="media/photo-2.jpeg" alt="巡視照 2">
            <img src="media/photo-3.jpeg" alt="巡視照 3">
            <img src="media/photo-4.jpeg" alt="巡視照 4">
            <img src="media/photo-5.jpeg" alt="巡視照 5">
            <img src="media/photo-6.jpeg" alt="巡視照 6">
        </div>
    </section>

    <!-- 中段下：動態影音區 -->
    <section class="video-section">
        <h3>打混摸魚實況</h3>
        <video src="media/cat-video.mov" muted autoplay loop playsinline></video>
    </section>

    <!-- 底部：社群入口 -->
    <footer>
        <a href="https://line.me/S/sticker/33531700/?lang=zh-Hant&utm_source=gnsh_stickerDetail" target="_blank" class="social-btn">查看工地貓的LINE貼圖</a>
    </footer>

    <script src="script.js"></script>
</body>
</html>
